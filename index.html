<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicita más información</title>

    <!-- ==============================
         DISEÑO
    =============================== -->

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    #30294a 0%,
                    #191824 35%,
                    #0d0d13 80%
                );

            color: #ffffff;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 22px;
        }


        .pagina {
            width: 100%;
            max-width: 470px;

            text-align: center;

            animation: aparecer .7s ease;
        }


        /* IDENTIDAD */

        .marca {
            width: 64px;
            height: 64px;

            margin: 0 auto 25px;

            border-radius: 19px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #eeeaff,
                    #a493ed
                );

            color: #181624;

            font-size: 28px;
            font-weight: 700;

            box-shadow:
                0 12px 35px rgba(120,100,200,.25);
        }


        /* TARJETA */

        .tarjeta {
            background: rgba(255,255,255,.075);

            border: 1px solid rgba(255,255,255,.11);

            border-radius: 25px;

            padding: 43px 30px 34px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px rgba(0,0,0,.38);
        }


        /* TITULO */

        h1 {
            margin: 0 0 14px;

            font-size: clamp(28px, 7vw, 36px);

            line-height: 1.15;

            letter-spacing: -.8px;

            font-weight: 700;
        }


        /* DESCRIPCIÓN */

        .descripcion {
            max-width: 350px;

            margin: 0 auto 30px;

            color: rgba(255,255,255,.68);

            font-size: 16px;

            line-height: 1.6;
        }


        /* BOTÓN */

        .boton {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            width: 100%;

            padding: 17px 22px;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #ddd6ff
                );

            color: #171622;

            border: 1px solid rgba(255,255,255,.75);

            text-decoration: none;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 30px rgba(0,0,0,.22);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                filter .2s ease;
        }


        .boton:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 35px rgba(0,0,0,.32);

            filter: brightness(1.04);
        }


        .boton:active {
            transform: scale(.98);
        }


        /* ICONO */

        .icono {
            width: 26px;
            height: 26px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #171622;

            color: #ffffff;

            font-size: 14px;
        }


        /* TEXTO INFERIOR */

        .confianza {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 7px;

            margin-top: 21px;

            color: rgba(255,255,255,.45);

            font-size: 12px;
        }


        .punto {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #a995ff;
        }


        /* ESTADO DE CARGA */

        .procesando {
            opacity: .65;

            pointer-events: none;
        }


        /* ANIMACIÓN */

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* MÓVIL */

        @media (max-width: 480px) {

            body {
                padding: 18px;
            }

            .tarjeta {
                padding: 36px 22px 30px;
                border-radius: 21px;
            }

            .marca {
                width: 56px;
                height: 56px;
                border-radius: 16px;
            }

            h1 {
                font-size: 29px;
            }

            .descripcion {
                font-size: 15px;
            }

            .boton {
                padding: 16px;
            }

        }

    </style>
</head>


<body>

    <main class="pagina">

        <div class="marca">
            ✦
        </div>


        <section class="tarjeta">

            <h1>
                Solicita más información
            </h1>


            <p class="descripcion">
                Estamos disponibles para atenderte y
                resolver tus dudas de manera directa
                y personalizada.
            </p>


            <a
                id="boton-contacto"
                class="boton"
                href="https://wa.me/525635121377?text=Solicito%20más%20información"
                target="_blank"
                rel="noopener"
            >

                <span class="icono">
                    →
                </span>

                <span>
                    Quiero más información
                </span>

            </a>


            <div class="confianza">

                <span class="punto"></span>

                Atención directa

            </div>

        </section>

    </main>


    <!-- ==============================
         REGISTRO DEL CONTACTO
    =============================== -->

    <script>

        const boton = document.getElementById('boton-contacto');

        boton.addEventListener('click', function(event) {

            // Evitar que el enlace se abra inmediatamente
            event.preventDefault();

            // Evitar dobles clics
            if (boton.classList.contains('procesando')) {
                return;
            }

            boton.classList.add('procesando');

            const destino = boton.href;

            // Identificador único para esta acción
            const eventID =
                'contact_' +
                Date.now() +
                '_' +
                Math.random().toString(36).substring(2, 10);

            /*
             * Registrar Contact.
             * No enviamos parámetros indicando WhatsApp.
             */
            fbq(
                'track',
                'Contact',
                {},
                {
                    eventID: eventID
                }
            );

            /*
             * Dar tiempo al Pixel para enviar el evento
             * antes de abrir el destino.
             */
            setTimeout(function() {

                window.location.href = destino;

            }, 700);

        });

    </script>

</body>
</html>
